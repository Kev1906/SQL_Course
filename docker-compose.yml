version: "3.9"

services:

  postgres:

    image: postgres:17

    container_name: sql-course

    restart: unless-stopped

    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: datamartx

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d

volumes:
  postgres_data: